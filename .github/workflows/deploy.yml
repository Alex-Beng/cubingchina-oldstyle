name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  schedule:
    # refresh the API snapshot every 6 hours
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json is generated with npm 11; npm 10 crashes on it
      # ("Exit handler never called!") and leaves node_modules incomplete.
      - name: Upgrade npm
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: |
          npm ci --no-audit --no-fund
          test -f node_modules/vite/bin/vite.js

      - name: Ensure styles are built
        run: |
          if [ -f public/f/build/css/common.min.css ] && [ -f public/f/build/css/main.min.css ]; then
            echo "Committed styles found, skipping rebuild."
          else
            npm run build:styles
          fi

      - name: Fetch API snapshot
        env:
          SNAPSHOT_NEWS_PAGES: '10'
          SNAPSHOT_DETAIL_YEARS: '2'
        run: npm run build:snapshot

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CUBING_API_BASE: ${{ vars.VITE_CUBING_API_BASE || 'https://cubingchina-oldstyle-proxy.pythoneralex.workers.dev' }}
          VITE_WCA_API_BASE: ${{ vars.VITE_WCA_API_BASE || 'https://wca-api.cubing.com' }}
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
